name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'dashboard/app/bun.lock', '.bun-version') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      # The layout suite needs POSIX pty/termios, so pyte installs on Linux only; it self-skips elsewhere.
      - name: Install pyte
        if: runner.os == 'Linux'
        run: python3 -m pip install --quiet pyte
      # Lint on Linux only, before the suite, so a lint error fails fast on this job's install.
      - name: Lint
        if: runner.os == 'Linux'
        run: bun install --frozen-lockfile && bun run lint
      - run: bun run verify
