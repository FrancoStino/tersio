name: Release assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The release packs with the Bun the lockfile was frozen against.
      # A different Bun can break --frozen-lockfile on a future major.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Build and pack
        run: |
          bun install --frozen-lockfile
          bun run build
          bun pm pack --destination .
          mv krtclcdy-tersio-*.tgz tersio-npm.tgz
      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" install.sh install.ps1 \
            tersio-npm.tgz --clobber --repo "${GITHUB_REPOSITORY}" \
            || gh release create "${GITHUB_REF_NAME}" install.sh install.ps1 \
              tersio-npm.tgz --generate-notes --repo "${GITHUB_REPOSITORY}"
